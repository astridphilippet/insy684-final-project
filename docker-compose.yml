services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"

  mlflow:
    image: busybox # placeholder, P2 replaces this with the real MLflow server
    command: tail -f /dev/null

  model-api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_NAME: ${MODEL_NAME:-CHANGE_ME_model}
    depends_on:
      - mlflow

  frontend:
    image: busybox # placeholder, P5 replaces this with the Flask webpage
    command: tail -f /dev/null
    ports:
      - "8080:8080"

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
